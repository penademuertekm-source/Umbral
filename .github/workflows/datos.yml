# Genera public/datos/ con OpenStreetMap (npm run datos) en las máquinas de GitHub, que tienen
# acceso a Overpass y Nominatim, y guarda el resultado en la misma rama.
# Se ejecuta al cambiar este archivo o a mano desde la pestaña Actions ("Run workflow").
name: Datos de sombra

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/datos.yml

permissions:
  contents: write

concurrency:
  group: datos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: |
          npm ci
          npm run datos:preparar

      - name: Pruebas del pipeline
        run: npm run test:datos

      - name: Generar datos (OpenStreetMap + datos/provisional)
        run: npm run datos

      - name: Guardar los datos en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/datos datos/provisional docs/reporte-datos.md docs/validacion-sol.md
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "Datos generados con npm run datos (GitHub Actions)"
          git push
